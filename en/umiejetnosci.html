<style>
  /* próba wg projektu użytkownika: wybór klasy + 4 przyciski + 3 drzewka obok siebie + ognisko (ramka podstron) */
  .ramka-srodek.gorny-pas { padding: 1.4cqw 3.4% 1.2cqw; }
  /* listwy kończą się w tym miejscu wzoru, od którego zaczyna się listwa na ramka_dol.jpg (zmierzone: lewa 139, prawa 101 px kafelka 48×320)
     – bez widocznego sklejenia na styku z dołem */
  .ramka-srodek.gorny-pas {
    background:
      url("../assets/ramka_bok_l.png") left 0 bottom 9.925cqw / 4.003% auto repeat-y,   /* faza = ramka_dol_niebo2.jpg (1199×566) na górze: lewa 119, prawa 81 */
      url("../assets/ramka_bok_p.png") right 0 bottom 6.756cqw / 4.003% auto repeat-y,
      radial-gradient(ellipse at 50% 0%, #22252c 0%, #15171c 55%, #0f1014 100%);
  }
  /* przyciski odsunięte od listew ramki (użytkownik: wychodziły na ramkę) – ok. 12 px przerwy przy 1199 px */
  .klasy, .akcje { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9cqw 1.2cqw; margin-left: 1.6cqw; margin-right: 1.6cqw; }
  .akcje { margin-top: 1cqw; }
  .srodek-glowna { margin: 2.8cqw 0 2.8cqw; }   /* więcej miejsca nad i pod (użytkownik), równo z obu stron */
  /* wielkość jak przyciski języka w nagłówku (22,019% szer., 264×59 przy 1199 px), napis jak tam */
  .srodek-glowna .przycisk { width: 31cqw; aspect-ratio: 377 / 84; min-width: 0; font-size: 1.75cqw; letter-spacing: 0.22em; padding-left: 0.22em; }   /* jak „Strona główna” na podstronach */
  .klasy .przycisk, .akcje .przycisk { width: 100%; font-size: 1.25cqw; letter-spacing: 0.12em; padding-left: 0.12em; border: 0; cursor: pointer; }
  .klasy .przycisk.wybrany { color: #f3cf74; -webkit-text-stroke-color: #f3cf74; }
  .klasy .przycisk.wybrany::before, .klasy .przycisk.wybrany::after { opacity: 1; }
  .akcje .nieb { color: #8a8aff; -webkit-text-stroke-color: #8a8aff; }
  .akcje .czer { color: #e8312c; -webkit-text-stroke-color: #e8312c; }
  /* włączony tryb (użytkownik): jak wybrana klasa – zapalone kamienie, bez poświaty */
  .akcje .wlaczony::before, .akcje .wlaczony::after { opacity: 1; }

  /* 3 drzewka w pikselach gry (HD), skalowane do szerokości (skala w JS) */
  .drzewa { position: relative; width: 100%; margin-top: 1.4cqw; aspect-ratio: var(--dw) / var(--dh); overflow: hidden; }
  .drzewa-in { position: absolute; left: 0; top: 0; transform: scale(var(--s, .3)); transform-origin: 0 0; user-select: none; }
  .drzewa img { width: auto; height: auto; display: block; }
  .drz { position: absolute; top: 0; width: 784px; height: 1214px; }
  /* jedna zakładka na drzewko, wyśrodkowana (wycięta z grafiki drzewka); pod nią kamień drzewka bez paska zakładek */
  /* jedna szeroka zakładka na całe drzewko: grafika zakładki z gry, rogi bez zmian, środek rozciągnięty (border-image) */
  /* zakładka: faktura środka zakładki z gry + równa obwódka dookoła (bez rozciągania krawędzi) */
  .zakl1 { top: 0; height: 96px;   /* wyższe zakładki (użytkownik) */ box-sizing: border-box; border: 4px solid #4b4740; border-radius: 8px 8px 0 0;
    background: url("../assets/wa_zakl_srodek_n.png") center / 100% 100%;
    box-shadow: inset 0 0 0 2px #111, inset 0 10px 18px rgba(255,255,255,.04), 0 2px 6px rgba(0,0,0,.7); }
  .zakl1.aktywna { border-color: #b9a67a; background-image: url("../assets/wa_zakl_srodek.png");
    box-shadow: inset 0 0 0 2px #2a2620, inset 0 12px 22px rgba(255,255,255,.10), 0 0 10px rgba(185,166,122,.35); }
  /* romb z grafiki gry (cały, 31×31, tło przezroczyste) na środku dolnej krawędzi wybranej zakładki */
  .romb { width: 31px; height: 31px; top: 81px; display: none; }
  .drz.cel .romb, .drz.najechana .romb { display: block; }
  .cialo { left: 0; right: 0; bottom: 0; overflow: hidden; box-shadow: inset 9px 0 0 #0a0a0b, inset -9px 0 0 #0a0a0b, inset 0 -9px 0 #0a0a0b, inset 0 9px 0 #0a0a0b,
    inset 11px 0 6px rgba(0,0,0,.6), inset -11px 0 6px rgba(0,0,0,.6), inset 0 -11px 6px rgba(0,0,0,.6), inset 0 11px 6px rgba(0,0,0,.6); }   /* brzegi 9 px dookoła (także góra) */
  .cialo img { position: absolute; left: 0; }
  .drz > * { position: absolute; }
  /* nazwa drzewka na całej jego zakładce (322×99 w grze); po najechaniu cała zakładka się podświetla */
  .nazwa-drzewa { top: 0; height: 96px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font: 54px "Cinzel", serif; letter-spacing: .14em; white-space: nowrap; color: #e6e1d4; font-variant: small-caps; text-shadow: 0 2px 4px #000;
    border-radius: 6px; transition: background .15s, box-shadow .15s, color .15s; }
  /* podświetlenie jak aktywna zakładka w grze (użytkownik): jasna zakładka i jasny napis, zwykła – ciemna z przygaszonym napisem */
  .nazwa-drzewa { color: #8b93a6; }
  .nazwa-drzewa:hover { color: #c4c8d2; }   /* najechanie tylko rozjaśnia napis – wybór dopiero kliknięciem */
  .nazwa-drzewa.cel { color: #e2e2e2; }
  .um { width: 132px; height: 130px; cursor: pointer; background-repeat: no-repeat; }
  .um:hover { filter: brightness(1.5); }
  .licznik { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    font: 700 34px "Cinzel", serif;   /* mniejsze (użytkownik) – mieszczą się w kwadraciku */ color: #fff; pointer-events: none; text-shadow: 0 2px 3px #000; }
  .licznik.bonus { color: rgb(110,110,255); }
  .pod-drzewami { text-align: center; margin-top: 1cqw; }
  /* licznik w ciemnym pasku jak dolny pasek panelu w grze */
  .pozostalo { display: inline-block; padding: 0.35em 1.4em; font: 1.7cqw "Cinzel", serif; letter-spacing: .12em; font-variant: small-caps; color: #fff;
    text-shadow: 0 2px 4px #000; }   /* bez ramki (użytkownik) */
  .pozostalo.zero { color: #5f6b85; }
  /* biały, ta sama wielkość co licznik punktów, więcej miejsca nad i pod (użytkownik) */
  .podpowiedz { text-align: center; font: 1.7cqw "Cinzel", serif; letter-spacing: .12em; font-variant: small-caps; color: #fff;
    margin: 2.4cqw 0 1.6cqw; text-shadow: 0 2px 4px #000; white-space: pre-line; line-height: 1.6; }   /* dwie linijki (użytkownik) */
  .drzewa { margin-top: 0.6cqw; }

  /* ognisko (wycięte ze szkicu) między listwami, dół ramki */
  .obraz { position: relative; padding: 0 4.003%;
    background: url("../assets/ramka_bok_l.png") left top / 4.003% auto repeat-y, url("../assets/ramka_bok_p.png") right top / 4.003% auto repeat-y, #0f1014; }
  /* zdjęcie podniesione (użytkownik): ucięte ok. 170 px nieba u góry (1455×862 → widoczne 1455×692), postacie wyżej */
  .obraz img { display: block; width: 100%; height: auto; aspect-ratio: 1455 / 692; object-fit: cover; object-position: center bottom; }
  .obraz .stopka { top: auto; bottom: 1.6cqw; }
  .dol { aspect-ratio: 1199 / 44; background: url("../assets/ramka_dol.jpg") center bottom / 100% auto no-repeat; }

  /* dymek jak w grze */
  .dymek { position: fixed; z-index: 10; display: none; padding: .25em .6em; text-align: center; white-space: nowrap;
    background: rgba(0,0,0,.82); color: #fff; font: 16px "Cinzel", serif; letter-spacing: .05em; line-height: 1.42; pointer-events: none; }
  .dymek .n { color: #00ff00; }
  .dymek .pusta { height: .9em; }
</style>

// --- parser wzorów D2 ---
const WZ_CACHE = {};
function tokeny(s) {
  const t = []; let i = 0;

    const c = s[i];

    if (c === "'") { const j = s.indexOf("'", i + 1); t.push({ str: s.slice(i + 1, j) }); i = j + 1; continue; }
    const two = s.substr(i, 2);
    if (["<=", ">=", "==", "!=", "&&", "||"].includes(two)) { t.push({ op: two }); i += 2; continue; }

}

      const f = x.id.toLowerCase();

// konteksty: umiejętność {typ:"s", nazwa, row, lvl, blvl} / pocisk {typ:"m", row, lvl}
function ctxUm(nazwa) { const row = D.skills[nazwa]; const l = lv(nazwa); return { typ: "s", nazwa, row: row || {}, lvl: l.lvl, blvl: l.blvl }; }

  if ((m = /^(ln|dm)(\d\d)$/.exec(kod)) && PARY[m[2]]) {
    const [a, b] = PARY[m[2]]; const p1 = par(row, a), p2 = par(row, b);
    if (lvl <= 0) return 0;   // gra: bez poziomu wartość liniowa = 0 (Demonic Mastery/Blood Oath bez punktów)
    if (m[1] === "ln") return p1 + (lvl - 1) * p2;
    return dmWzor(p1, p2, lvl);
  }
  if ((m = /^clc(\d+)$/.exec(kod))) return licz(row["calc" + m[1]], ctx);
  if ((m = /^ast(\d)$/.exec(kod))) return licz(row["aurastatcalc" + m[1]], ctx);
  if ((m = /^pst?(\d+)$/.exec(kod))) return licz(row["passivecalc" + m[1]], ctx);   // pst1..pst9, ps10..ps14
  if (kod === "len") return licz(row.auralencalc, ctx);
  if (kod === "rng") return licz(row.aurarangecalc, ctx);
  if (kod === "pets") return licz(row.petmax, ctx);
  if (kod === "toht") return row.ToHitCalc ? licz(row.ToHitCalc, ctx) : num(row.ToHit) + (lvl - 1) * num(row.LevToHit);
  if (kod === "usmc") return manaKoszt(row, lvl);
  if (kod === "mana") return manaKoszt(row, lvl) >> 8;
  if (kod === "mps") return tr(manaKoszt(row, lvl) * 25 / 256);
  if (["edmn", "edmx", "enma", "exma", "edns", "edxs", "enms", "exms"].includes(kod)) {
    const d = obrazeniaElem(row, lvl, ctx, "EMinLev", "EMaxLev"); const v = /n[ma]|ns/.test(kod.slice(1, 3)) || kod === "edmn" ? d[0] : d[1];
    const mn = kod === "edmn" || kod === "enma" || kod === "edns" || kod === "enms";
    const w = mn ? d[0] : d[1]; return /s$/.test(kod) ? w : w >> 8;
  }
  if (kod === "edln" || kod === "edma") return dlugoscElem(row, lvl, ctx);
  if (["pnma", "pxma", "pnms", "pxms"].includes(kod)) { const d = obrazeniaFiz(row, lvl, ctx, "MinDam", "MaxDam"); const w = kod[1] === "n" ? d[0] : d[1]; return /s$/.test(kod) ? w : w >> 8; }
  if ((m = /^m(\d)(en|ex|nm|xm|el|rn)$/.exec(kod))) {
    const mc = pociskCtx(ctx, +m[1]); if (!mc) return 0;
    if (m[2] === "el") return dlugoscElem(mc.row, lvl, mc);
    if (m[2] === "rn") return licz(mc.row.Range, mc);
    const d = obrazeniaElem(mc.row, lvl, mc, "MinELev", "MaxELev");
    return (m[2] === "en" || m[2] === "nm" ? d[0] : d[1]) >> 8;
  }
  return 0;   // maestrie (madm, mair, math…) i nieznane kody: 0
}

// --- printf jak w grze: %d, %+d, %s, %% ---
function printf(fmt, ...a) {
  let i = 0;
  return String(fmt).replace(/%(\+?)(d|i|s|%)/g, (_, plus, t) => {
    if (t === "%") return "%";
    const v = a[i++];
    if (t === "s") return v == null ? "" : v;
    const n = Number.isInteger(+v) ? tr(+v || 0) : +v; return plus && n >= 0 ? "+" + n : String(n);
  });
}
const KOLORY = ["#fff", "#ff4d4d", "#00ff00", "#6969ff", "#c7b377", "#696969", "#000", "#d0c27d", "#ffa800", "#ffff64", "#008000", "#ae00ff", "#00c800"];
function esc(s) { return String(s).replace(/ÿc./g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>"); }

// przywołańce (typ 13: życie, typ 34: obrażenia) – wartości z monstats dla Piekła, jak w dymku gry
const TRUD = "(H)";
function zycieSluge(nazwa) { const s = (D.skills[nazwa] || {}).summon, m = s && D.mon[s]; return m ? num(m["MinHP" + TRUD]) : 0; }
function dmgSlugi(nazwa) { const s = (D.skills[nazwa] || {}).summon, m = s && D.mon[s]; return m ? [num(m["A1MinD" + TRUD]), num(m["A1MaxD" + TRUD])] : [0, 0]; }

function linia(l, ctx) {
  const [typ, ta, tb, a, b] = l;
  const A = () => licz(a, ctx), B = () => licz(b, ctx);
  let t, kolor = null;
  switch (typ) {
    case 13: { const zy = zycieSluge(ctx.nazwa); t = printf(S(ta), tr((zy + B()) * (100 + A()) / 100)); break; }
    case 34: {   // obrażenia sługi: monstats × (100 + damagepercent)/100 + item_normaldamage (pasywne statystyki umiejętności)
      const d = dmgSlugi(ctx.nazwa); let proc = 0, plus = 0;
      for (let i = 1; i <= 14; i++) {
        const st = ctx.row["passivestat" + i];
        if (st === "damagepercent") proc += licz(ctx.row["passivecalc" + i], ctx);
        if (st === "item_normaldamage") plus += licz(ctx.row["passivecalc" + i], ctx);
      }
      t = printf(S(ta), tr(d[0] * (100 + proc) / 100) + plus, tr(d[1] * (100 + proc) / 100) + plus); break;
    }
    case 36: { const bb = B(); const v = bb ? tr(A() / bb) : A(); if (v === 0) return ""; t = printf(S(v === 1 || !tb ? ta : tb), v); break; }   // gra nie pokazuje zera (np. [PH]Effect Length)
    case 31: { const bb = B() || 1; const v = tr(tr(A() / (D.klatwa || 1)) / bb); if (v === 0) return ""; t = printf(S(v === 1 || !tb ? ta : tb), v); break; }   // czas klątwy / AiCurseDivisor (Piekło)
    case 18: t = S(ta); break;
    case 40: t = printf(S(ta), S(tb)); kolor = KOLORY[A()] || null; break;
    case 74: {   // tekst bez liczby z wartością 0 = linijka wyłączona (mod: Spętanie – opis tylko dla bieżącego progu poziomu)
      const v = A(); if (v === 0 && !/%[+]?d/.test(S(ta))) return ""; t = printf(S(ta), v); break;
    }
    case 75: t = printf(S(ta), A(), B()); break;
    case 76: t = printf(S(ta), S(tb), A()); break;
    case 77: t = printf(S(ta), S(tb), A(), B()); break;
    case 78: t = S(tb) || printf(S(ta), ""); break;
    case 79: { const bb = B(); const v = bb ? Math.round(A() * 10 / bb) / 10 : A(); t = printf(S(ta), S(tb), v); break; }   // ułamek: „+0.2 seconds”
    default: { const s = S(ta); t = s.includes("%") ? printf(s, A(), B()) : (s + (a ? " " + A() : "")); }
  }
  return `<div${kolor ? ` style="color:${kolor}"` : ""}>${esc(t)}</div>`;
}

function zLinii(lista, ctx, odwrotnie) { const l = odwrotnie ? [...lista].reverse() : lista; return l.map(x => linia(x, ctx)).join(""); }
function ctxNaPoziomie(u, blvl, lvl) { NADPIS = { [u.sk]: { blvl, lvl } }; const c = ctxUm(u.sk); return c; }

function trescDymka(u) {
  const o = D.opisy[u.sk]; if (!o) return `<div class="n">${esc(u.name)}</div>`;
  const { p, b, razem } = poziom(u);
  let h = `<div class="n">${esc(S(o.name))}</div><div>${esc(S(o.long))}</div>`;
  const pusta = '<div class="pusta"></div>';
  const lvlTeraz = razem > 0 ? razem : 1;
  if (o.dsc2.length) h += pusta + zLinii(o.dsc2, ctxNaPoziomie(u, Math.max(p, razem > 0 ? p : 1), lvlTeraz), true);
  h += pusta;
  if (razem === 0) {
    h += `<div>${esc(S("StrSkill17"))}</div>` + zLinii(o.desc, ctxNaPoziomie(u, 1, 1), true);
  } else {
    h += `<div>${esc(b ? printf(S("TooltipSkillLevelBonus"), razem, p) : printf(S("StrSkill2"), razem))}</div>` + zLinii(o.desc, ctxNaPoziomie(u, p, razem), true);
    h += pusta + `<div>${esc(S("StrSkill1"))}</div>` + zLinii(o.desc, ctxNaPoziomie(u, p + 1, razem + 1), true);
  }
  if (o.dsc3.length) h += pusta + zLinii(o.dsc3, ctxNaPoziomie(u, p, razem), false);
  NADPIS = {};
  return h;
}

// dymek jak w grze: stoi pod ikoną (wyśrodkowany na niej), nie chodzi za myszą; rozmiar rośnie z panelem
let ostatniaMysz = null;   // tu: ikona, nad którą jest dymek
function pokazDymek(u, ikona) {
  if (!ikona) return; ostatniaMysz = ikona;
  const skala = window.SKALA_DYMKA ? SKALA_DYMKA() : ramka.clientWidth / D.panel[0];   // strona z 3 drzewkami ma własną skalę
  dymek.style.fontSize = (24 * skala).toFixed(1) + "px";
  dymek.innerHTML = trescDymka(u);
  dymek.style.display = "block";
  const r = ikona.getBoundingClientRect(), w = dymek.offsetWidth, h = dymek.offsetHeight;
  let x = r.left + r.width / 2 - w / 2, y = r.bottom;
  // w poziomie dymek trzyma się ramki strony (między listwami), a gdy jest szerszy – okna
  const rm = document.querySelector(".ramka"), rr = rm ? rm.getBoundingClientRect() : null, lw = rr ? rr.width * 0.04003 + 6 : 0;
  const lewo = rr ? Math.max(8, rr.left + lw) : 8, prawo = rr ? Math.min(innerWidth - 8, rr.right - lw) : innerWidth - 8;
  if (w <= prawo - lewo) x = Math.max(lewo, Math.min(x, prawo - w));
  else x = Math.max(8, Math.min(x, innerWidth - w - 8));
  // brak miejsca pod ikoną → dymek nad ikoną (użytkownik); gdy i tam się nie mieści – przyklejony do dołu okna
  if (y + h > innerHeight - 8) y = r.top - h >= 8 ? r.top - h : Math.max(8, innerHeight - h - 8);
  dymek.style.left = x + "px"; dymek.style.top = y + "px";
}
addEventListener("scroll", () => { if (dymek.style.display === "block" && ostatniaMysz) dymek.style.display = "none"; }, { passive: true });



function rysuj() {
  for (const w of widoki) { const { razem, b } = poziom(w.u); w.li.textContent = razem > 0 ? razem : ""; w.li.classList.toggle("bonus", b > 0); }
  const zostalo = PUNKTY - wydane();
  $("pozostalo").textContent = printf(T.pozostalo, zostalo); $("pozostalo").classList.toggle("zero", zostalo === 0);
  $("b-bonus").classList.toggle("wlaczony", st.trybBonus);
  $("b-all").textContent = st.all ? printf(T.allIle, st.all) : T.all;
  const lista = o => Object.entries(o).filter(([, v]) => v > 0).map(([k, v]) => k + ":" + v).join(",");
  const cz = ["k=" + KOD]; const p = lista(st.pkt), b = lista(st.bon);
  if (p) cz.push("p=" + p); if (b) cz.push("b=" + b); if (st.all) cz.push("a=" + st.all);
  history.replaceState(null, "", "#" + cz.join("&"));
}
(function wczytaj() {
  const prm = new URLSearchParams(location.hash.slice(1));
  const czyt = s => Object.fromEntries((s || "").split(",").filter(Boolean).map(x => x.split(":").map(Number)));
  st.pkt = czyt(prm.get("p")); st.bon = czyt(prm.get("b")); st.all = +prm.get("a") || 0;
  let suma = 0; for (const k in st.pkt) { st.pkt[k] = Math.min(MAKS, st.pkt[k]); suma += st.pkt[k]; if (suma > PUNKTY) st.pkt[k] -= suma - PUNKTY, suma = PUNKTY; }
})();
$("b-bonus").onclick = () => { st.trybBonus = !st.trybBonus; rysuj(); };
$("b-all").onclick = () => { st.all = Math.min(20, st.all + 1); rysuj(); };
$("b-all").oncontextmenu = ev => { ev.preventDefault(); st.all = Math.max(0, st.all - 1); rysuj(); };
$("b-reset").onclick = () => { st.pkt = {}; st.bon = {}; st.all = 0; st.trybBonus = false; rysuj(); };
odswiezZakladki();
// po najechaniu na „Reset drzewka” nazwa drzewka, które się wyzeruje, świeci na złoto
if ($("b-reset-drzewo")) {
  $("b-reset-drzewo").onclick = () => resetDrzewa(ostatnieDrzewo);
  zaznaczDrzewo(0);   // od początku widać, które drzewko wyzeruje „Reset drzewka”
}
rysuj();
</script>
